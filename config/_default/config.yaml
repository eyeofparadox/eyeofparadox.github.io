baseURL: https://eyeofparadox.github.io/
title: eyeofparadox on github
copyright: "Copyright © 2007-2025 eyeofparadox. All Rights Reserved."
defaultContentLanguage: en
enableInlineShortcodes: true
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
ignoreErrors: ["error-remote-getjson"]
ignoreLogs: ["warning-goldmark-raw-html"]

pagination:
  pagerSize: 20

pygmentsUseClasses: true

taxonomies:
  # archive: archives
  author: authors
  series: series
  category: categories
  tag: tags

build:
  writeStats: true

permalinks:
  posts: /posts/:year/:month/:title/
  pages: /pages/:year/:month/:title/

module:
  imports:
    - path: github.com/eyeofparadox/hugo-theme-bootstrap

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    lineNos: true
    noClasses: false
    lineNumbersInTable: false
