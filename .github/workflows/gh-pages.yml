# gh-pages.yml
name: Build and Deploy Hugo site

on:
  # Trigger 1: Push to main branch
  push:
    branches:
      - main

  # Trigger 2: Manual run from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo (with submodules, full history)
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Step 2: Setup Node (needed for Bootstrap assets pipeline)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Cache npm dependencies
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install npm dependencies
      - name: Install dependencies
        run: npm install

      # Step 5: Setup Hugo (pin to tested version, Extended)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'   # 👈 pin to your tested version
          extended: true

      # Step 6: Build site
      - name: Build
        run: hugo --minify --gc --enableGitInfo

      # Step 7: Deploy to GitHub Pages
      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true   # 👈 wipe gh-pages before publishing
          git_config: |
            user.name=github-actions[bot]
            user.email=41898282+github-actions[bot]@users.noreply.github.com
